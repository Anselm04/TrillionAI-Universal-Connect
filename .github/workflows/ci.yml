name: connector-sdk-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin
          POSTGRES_DB: universal_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d universal_connect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-only-admin@127.0.0.1:5432/universal_connect_test
      TEST_RUNTIME_DATABASE_URL: postgresql://uc_runtime:ci-only-runtime@127.0.0.1:5432/universal_connect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run db:test:setup
      - name: Verify runtime startup gate with disposable CI credentials
        run: npm run service:preflight
        env:
          PORT: '8080'
          PUBLIC_ORIGIN: https://connect.example.com
          GITHUB_CALLBACK_URL: https://connect.example.com/oauth/callback
          DATABASE_URL: ${{ env.TEST_RUNTIME_DATABASE_URL }}
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-public-fixture
          SUPABASE_SERVICE_ROLE_KEY: ci-private-fixture
          GITHUB_CLIENT_ID: client123456
          GITHUB_CLIENT_SECRET: ci-not-real-github-secret
          VAULT_KEY_BASE64: Hx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8=
          VAULT_KEY_VERSION: v1
      - run: npm test
