name: flutter-connect-portal-ci
on:
  push:
    paths:
      - 'apps/connect-portal/**'
      - '.github/workflows/flutter-connect-portal.yml'
  pull_request:
    paths:
      - 'apps/connect-portal/**'
      - '.github/workflows/flutter-connect-portal.yml'
permissions:
  contents: read
jobs:
  flutter-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/connect-portal
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=ci-non-secret
